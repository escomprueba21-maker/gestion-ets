<div style="background-color: #003366; padding: 10px; text-align: center;">
    <h1 style="color: white; font-family: Arial, sans-serif; text-transform: uppercase; font-weight: bold;">
        ESCOM
    </h1>
</div>

<div style="background-color: #f4f4f4; padding: 20px; font-family: Arial, sans-serif; color: #333; line-height: 1.6;">

    <h2 style="color: #003366;">Confirmar Usuario</h2>

    <p>
        Hola <b>{nombre}</b>,
    </p>

    <p>
        Hemos recibido tu solicitud. Para activar tu cuenta, por favor confirma tu usuario dando clic en el siguiente enlace:
    </p>

    <p style="text-align: center; margin: 20px 0;">
        <a href="{link}"
           style="background-color: #003366; color: white; padding: 12px 20px; text-decoration: none; font-size: 18px; border-radius: 5px;">
            Confirmar Usuario
        </a>
    </p>

    <p>
        Si no solicitaste este registro, puedes ignorar este correo.
    </p>

    <p>
        Saludos,<br>
        Equipo ESCOM
    </p>
</div>
