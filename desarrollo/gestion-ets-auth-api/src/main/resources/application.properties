# OPEN API
quarkus.smallrye-openapi.info-title=gestion-ets-auth-API
quarkus.smallrye-openapi.info-version=${project.version}
quarkus.smallrye-openapi.info-description=API Rest que implementa el negocio del usuario en el sistema
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.always-include=true

quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

quarkus.datasource.username=${PGUSER}
quarkus.datasource.password=${PGPASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
quarkus.mailer.auth-methods=PLAIN LOGIN
quarkus.mailer.from=${MAILER_FROM}
quarkus.mailer.host=${MAILER_HOST}
quarkus.mailer.port=${MAILER_PORT}
quarkus.mailer.start-tls=${MAILER_START_TLS}
quarkus.mailer.username=${MAILER_USERNAME}
quarkus.mailer.password=${MAILER_PASSWORD}
quarkus.mailer.mock=${MAILER_MOCK}

app.deeplink.base-url=${APP_CONFIRMACION}
app.forgotpassword.base-url=${APP_OLVIDAR_CONTRASENIA}
mp.jwt.verify.issuer=auth-ets-api
# Duraci�n del access token en segundos (15 min)
jwt.access.duration=900
jwt.refresh.duration=604800
quarkus.http.port = ${PORT_AUTH}

# Validación de tokens entrantes
quarkus.http.auth.permission.public.paths=/auth/*,/q/health/*,/q/openapi,/q/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit


# Resto requiere autenticaci�n
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
